name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    name: pytest (offline) + release gate readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check --upgrade "build>=1.2" "twine>=6.1"
      - run: python -m pip install --disable-pip-version-check -e ".[test]"
      - run: python -m pytest -q
      - name: Release gate (readiness; never publishes on push/PR)
        run: >-
          python .github/scripts/szl_pypi_release_gate.py
          --packages "szl-inference-gateway=.:pypi"
          --repo "${{ github.repository }}"
          --event "${{ github.event_name }}"
          --ref-type "${{ github.ref_type }}"
          --ref-name "${{ github.ref_name }}"
          --outdir dist
