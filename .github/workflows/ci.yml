name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + release-gate readiness (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact source revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "${actual}" = "${SOURCE_REVISION}"
      # actions/setup-python v7.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package, tests, build tooling
        run: python -m pip install --disable-pip-version-check --upgrade -e ".[test]" "build>=1.2" "twine>=6.1"
      - name: Compile check
        run: python -m compileall -q src tests
      - name: Offline tests
        run: python -m pytest -q
      - name: Release gate (readiness; never publishes)
        run: >-
          python .github/scripts/szl_pypi_release_gate.py
          --packages "szl-inference-gateway=.:pypi"
          --repo "${{ github.repository }}"
          --event "${{ github.event_name }}"
          --ref-type "${{ github.ref_type }}"
          --ref-name "${{ github.ref_name }}"
          --outdir dist
